name: deterministic-proof

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run deterministic proof tests
        run: python -m unittest discover -s tests -v
      - name: Regenerate proof artifact
        run: python scripts/generate_proof.py
      - name: Verify proof artifact is current
        run: git diff --exit-code -- evidence/v0.03-checkpoint-proof.json
